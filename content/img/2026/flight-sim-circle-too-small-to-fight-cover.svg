<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="768" viewBox="0 0 1344 768">
  <rect width="1344" height="768" fill="#1f2a30"/>
  <g fill="#e9e2d0" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="610" r="1.4"/><circle cx="1210" cy="120" r="1.8"/>
    <circle cx="1100" cy="660" r="1.4"/><circle cx="80" cy="420" r="1.2"/><circle cx="1290" cy="400" r="1.3"/>
    <circle cx="400" cy="70" r="1.2"/><circle cx="960" cy="60" r="1.5"/><circle cx="1000" cy="720" r="1.2"/>
  </g>
  <circle cx="672" cy="384" r="210" fill="#26343b" stroke="#7b6a52" stroke-width="4"/>
  <circle cx="672" cy="384" r="210" fill="none" stroke="#e9e2d0" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 10" transform="scale(1)"/>
  <!-- two parallel tracks with room between -->
  <line x1="500" y1="330" x2="844" y2="330" stroke="#e9e2d0" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 12"/>
  <line x1="500" y1="438" x2="844" y2="438" stroke="#e9e2d0" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 12"/>
  <!-- plane heading right on upper track -->
  <g transform="translate(700,330)" fill="#e9e2d0">
    <path d="M-34,-4 L26,-4 Q38,0 26,4 L-34,4 Z"/>
    <path d="M-4,-4 L-18,-34 L-8,-34 L14,-4 Z"/>
    <path d="M-4,4 L-18,34 L-8,34 L14,4 Z"/>
