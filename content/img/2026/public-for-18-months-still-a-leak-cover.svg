<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#efe9dc"/>
  <!-- ripples from the one-time event at the left end of the timeline -->
  <g fill="none" stroke="#1f6f6b">
    <circle cx="300" cy="560" r="28" stroke-width="5" opacity="0.9"/>
    <circle cx="300" cy="560" r="62" stroke-width="4" opacity="0.55"/>
    <circle cx="300" cy="560" r="104" stroke-width="3" opacity="0.3"/>
    <circle cx="300" cy="560" r="152" stroke-width="2" opacity="0.15"/>
  </g>
  <circle cx="300" cy="560" r="12" fill="#1f6f6b"/>
  <!-- timeline: 19 monthly ticks, first = initial commit, last five = newest row -->
  <line x1="300" y1="560" x2="1300" y2="560" stroke="#23303a" stroke-width="4"/>
  <g stroke="#23303a" stroke-width="4">
    <line x1="352.6" y1="540" x2="352.6" y2="580"/><line x1="405.3" y1="540" x2="405.3" y2="580"/>
    <line x1="457.9" y1="540" x2="457.9" y2="580"/><line x1="510.5" y1="540" x2="510.5" y2="580"/>
    <line x1="563.2" y1="540" x2="563.2" y2="580"/><line x1="615.8" y1="540" x2="615.8" y2="580"/>
    <line x1="668.4" y1="540" x2="668.4" y2="580"/><line x1="721.1" y1="540" x2="721.1" y2="580"/>
    <line x1="773.7" y1="540" x2="773.7" y2="580"/><line x1="826.3" y1="540" x2="826.3" y2="580"/>
    <line x1="878.9" y1="540" x2="878.9" y2="580"/><line x1="931.6" y1="540" x2="931.6" y2="580"/>
    <line x1="984.2" y1="540" x2="984.2" y2="580"/>
  </g>
  <g stroke="#1f6f6b" stroke-width="8">
    <line x1="1036.8" y1="530" x2="1036.8" y2="590"/><line x1="1089.5" y1="530" x2="1089.5" y2="590"/>
    <line x1="1142.1" y1="530" x2="1142.1" y2="590"/><line x1="1194.7" y1="530" x2="1194.7" y2="590"/>
    <line x1="1247.4" y1="530" x2="1247.4" y2="590"/><line x1="1300" y1="530" x2="1300" y2="590"/>
  </g>
  <!-- the document sitting at the open end of the timeline, no text, only lines -->
  <g transform="translate(1000 230)">
    <rect x="0" y="0" width="300" height="250" rx="10" fill="#fbf8f1" stroke="#23303a" stroke-width="4"/>
    <rect x="30" y="34" width="150" height="14" rx="4" fill="#23303a"/>
    <rect x="30" y="72" width="240" height="9" rx="3" fill="#23303a" opacity="0.4"/>
    <rect x="30" y="96" width="220" height="9" rx="3" fill="#23303a" opacity="0.4"/>
    <rect x="30" y="120" width="240" height="9" rx="3" fill="#23303a" opacity="0.4"/>
    <rect x="30" y="160" width="240" height="12" rx="3" fill="#1f6f6b" opacity="0.85"/>
    <rect x="30" y="184" width="240" height="12" rx="3" fill="#1f6f6b" opacity="0.6"/>
    <rect x="30" y="208" width="240" height="12" rx="3" fill="#1f6f6b" opacity="0.4"/>
  </g>
  <line x1="1150" y1="480" x2="1150" y2="530" stroke="#23303a" stroke-width="3" stroke-dasharray="6 8"/>
</svg>
