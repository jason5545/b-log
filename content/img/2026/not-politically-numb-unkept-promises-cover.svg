<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ddd6"/>
      <stop offset="1" stop-color="#c4cbc0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f736c"/>
      <stop offset="1" stop-color="#5a5e58"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#d8ddd6"/>
  <rect x="0" y="0" width="1600" height="520" fill="url(#sky)"/>

  <!-- distant building silhouettes, edges only -->
  <g fill="#b7bfb4">
    <rect x="0" y="250" width="220" height="280"/>
    <rect x="200" y="200" width="160" height="330"/>
    <rect x="1380" y="210" width="220" height="320"/>
    <rect x="1280" y="280" width="140" height="250"/>
  </g>
  <g fill="#aeb6ab">
    <rect x="40" y="290" width="28" height="40"/>
    <rect x="90" y="290" width="28" height="40"/>
    <rect x="40" y="350" width="28" height="40"/>
    <rect x="90" y="350" width="28" height="40"/>
    <rect x="230" y="230" width="26" height="36"/>
    <rect x="280" y="230" width="26" height="36"/>
    <rect x="230" y="290" width="26" height="36"/>
    <rect x="280" y="290" width="26" height="36"/>
    <rect x="1420" y="250" width="26" height="36"/>
    <rect x="1470" y="250" width="26" height="36"/>
    <rect x="1420" y="310" width="26" height="36"/>
    <rect x="1470" y="310" width="26" height="36"/>
  </g>

  <!-- pavement -->
  <rect x="0" y="520" width="1600" height="380" fill="#cfc6b6"/>
  <path d="M0 520 H1600" stroke="#b9b09f" stroke-width="8"/>

  <!-- roadway at bottom edge (background only) -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#road)"/>
  <rect x="0" y="836" width="1600" height="10" fill="#c9a24a" opacity="0.7"/>

  <!-- curb, slightly misaligned cut in the center safe area -->
  <rect x="0" y="760" width="1600" height="22" fill="#9a9386"/>
  <path d="M690 760 L760 782 L1040 782 L1110 760 Z" fill="#cfc6b6"/>
  <path d="M760 782 L760 800 L1040 800 L1040 782 Z" fill="#8c867b"/>
  <!-- small gap at the lip, the almost-but-not-quite -->
  <rect x="760" y="800" width="280" height="6" fill="#5a5e58"/>
  <rect x="768" y="798" width="264" height="3" fill="#d4cbb8"/>

  <!-- bus-stop shelter, mid-right of safe area, no sign typography -->
  <g transform="translate(1060,300)">
    <rect x="0" y="80" width="220" height="12" fill="#3d4f45"/>
    <rect x="10" y="92" width="8" height="280" fill="#4a5c52"/>
    <rect x="202" y="92" width="8" height="280" fill="#4a5c52"/>
    <path d="M-8 80 L110 40 L228 80 L228 92 L-8 92 Z" fill="#5b6e63"/>
    <rect x="24" y="110" width="172" height="150" fill="#9aa89e" opacity="0.45"/>
    <rect x="24" y="110" width="172" height="8" fill="#3d4f45"/>
  </g>

  <!-- a simple bench under shelter -->
  <g fill="#6d6254">
    <rect x="1100" y="430" width="150" height="10"/>
    <rect x="1110" y="440" width="10" height="28"/>
    <rect x="1230" y="440" width="10" height="28"/>
  </g>

  <!-- desk-like low wall / ledge in center with slips and ruler -->
  <rect x="430" y="500" width="620" height="18" fill="#7a6a56"/>
  <rect x="430" y="518" width="620" height="70" fill="#8a7862"/>
  <rect x="438" y="524" width="604" height="56" fill="#d7ccb8"/>

  <!-- paper slips: some stamped (ring only, no glyphs), some blank, one torn -->
  <g>
    <!-- blank -->
    <rect x="470" y="536" width="86" height="36" fill="#f3eee4" stroke="#b7ab98" stroke-width="1.5"/>
    <!-- stamped complete: ochre ring -->
    <rect x="572" y="532" width="90" height="40" fill="#efe6d6" stroke="#b7ab98" stroke-width="1.5"/>
    <circle cx="617" cy="552" r="11" fill="none" stroke="#b25a2e" stroke-width="3"/>
    <!-- half: torn + half ring -->
    <path d="M682 536 H756 L748 548 L758 556 L746 564 L754 572 H682 Z" fill="#efe6d6" stroke="#b7ab98" stroke-width="1.5"/>
    <path d="M724 542 A11 11 0 0 1 724 564" fill="none" stroke="#b25a2e" stroke-width="3"/>
    <!-- blank slightly skewed -->
    <g transform="rotate(-4 830 554)">
      <rect x="790" y="534" width="84" height="38" fill="#f3eee4" stroke="#b7ab98" stroke-width="1.5"/>
    </g>
    <!-- stamped -->
    <rect x="890" y="536" width="86" height="36" fill="#efe6d6" stroke="#b7ab98" stroke-width="1.5"/>
    <circle cx="933" cy="554" r="10" fill="none" stroke="#b25a2e" stroke-width="3"/>
  </g>

  <!-- wooden ruler / yardstick across the slips, no numerals: just tick marks -->
  <g transform="rotate(-2 740 528)">
    <rect x="500" y="516" width="480" height="16" rx="1" fill="#c4a56a"/>
    <rect x="500" y="516" width="480" height="5" fill="#d8bc86"/>
    <!-- tick marks only -->
    <g stroke="#5a4630" stroke-width="1.4">
      <line x1="520" y1="516" x2="520" y2="528"/>
      <line x1="560" y1="516" x2="560" y2="524"/>
      <line x1="600" y1="516" x2="600" y2="528"/>
      <line x1="640" y1="516" x2="640" y2="524"/>
      <line x1="680" y1="516" x2="680" y2="528"/>
      <line x1="720" y1="516" x2="720" y2="524"/>
      <line x1="760" y1="516" x2="760" y2="528"/>
      <line x1="800" y1="516" x2="800" y2="524"/>
      <line x1="840" y1="516" x2="840" y2="528"/>
      <line x1="880" y1="516" x2="880" y2="524"/>
      <line x1="920" y1="516" x2="920" y2="528"/>
      <line x1="960" y1="516" x2="960" y2="524"/>
    </g>
  </g>

  <!-- manual wheelchair, center-left of safe area, 3/4 view, empty -->
  <g transform="translate(560,560)" fill="none" stroke="#3d4f45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- large rear wheel -->
    <circle cx="86" cy="118" r="46" stroke-width="8"/>
    <circle cx="86" cy="118" r="10" fill="#3d4f45" stroke="none"/>
    <!-- small front caster -->
    <circle cx="178" cy="142" r="16" stroke-width="6"/>
    <circle cx="178" cy="142" r="5" fill="#3d4f45" stroke="none"/>
    <!-- frame -->
    <path d="M86 118 L86 62 L160 62 L174 132"/>
    <path d="M86 62 L40 62 L34 96"/>
    <!-- seat -->
    <path d="M70 62 L150 62" stroke-width="10"/>
    <!-- backrest -->
    <path d="M70 62 L58 8" stroke-width="8"/>
    <path d="M44 14 L86 6" stroke-width="8"/>
    <!-- footrest -->
    <path d="M174 132 L198 148 L186 150" stroke-width="6"/>
    <!-- armrest -->
    <path d="M92 44 L150 44 L150 62" stroke-width="6"/>
    <!-- handrim hint -->
    <circle cx="86" cy="118" r="54" stroke-width="3" opacity="0.7"/>
  </g>
  <g transform="translate(560,560)" fill="#3d4f45">
    <circle cx="86" cy="118" r="6"/>
  </g>

  <!-- soft shadow under wheelchair -->
  <ellipse cx="670" cy="730" rx="110" ry="14" fill="#8e8778" opacity="0.28"/>
</svg>
