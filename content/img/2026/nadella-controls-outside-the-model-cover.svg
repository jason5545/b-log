<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3a36"/>
      <stop offset="1" stop-color="#1f2724"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f2c"/>
      <stop offset="1" stop-color="#3f2c1f"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f2c27a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2c27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#26302d" stroke-width="3" opacity="0.8">
    <line x1="0" y1="120" x2="1600" y2="120"/><line x1="0" y1="260" x2="1600" y2="260"/>
    <line x1="0" y1="400" x2="1600" y2="400"/><line x1="0" y1="540" x2="1600" y2="540"/>
  </g>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <!-- desk -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#desk)"/>
  <rect x="0" y="632" width="1600" height="14" fill="#6e4d35"/>

  <!-- log scroll (left) -->
  <g transform="rotate(-4 380 470)">
    <rect x="270" y="270" width="230" height="330" rx="6" fill="#efe3c8"/>
    <rect x="262" y="256" width="246" height="26" rx="13" fill="#d8c59c"/>
    <rect x="262" y="590" width="246" height="26" rx="13" fill="#d8c59c"/>
    <g stroke="#7a6a52" stroke-width="9" stroke-linecap="round">
      <line x1="300" y1="320" x2="470" y2="320"/>
      <line x1="300" y1="355" x2="440" y2="355"/>
      <line x1="300" y1="390" x2="460" y2="390"/>
      <line x1="300" y1="425" x2="420" y2="425"/>
      <line x1="300" y1="460" x2="465" y2="460"/>
      <line x1="300" y1="495" x2="430" y2="495"/>
    </g>
    <circle cx="455" cy="545" r="26" fill="none" stroke="#c8452f" stroke-width="7"/>
    <path d="M443 545 l9 9 l17 -19" fill="none" stroke="#c8452f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- harness frame (center) -->
  <rect x="610" y="230" width="380" height="380" rx="22" fill="#26302d" stroke="#9aa59c" stroke-width="10"/>
  <g stroke="#9aa59c" stroke-width="7" opacity="0.85">
    <line x1="705" y1="236" x2="705" y2="604"/>
    <line x1="800" y1="236" x2="800" y2="604"/>
    <line x1="895" y1="236" x2="895" y2="604"/>
  </g>
  <!-- model block inside -->
  <rect x="690" y="330" width="220" height="190" rx="28" fill="#d97757"/>
  <g transform="translate(800 425)" fill="#f6ead2">
    <rect x="-7" y="-46" width="14" height="92" rx="7"/>
    <rect x="-7" y="-46" width="14" height="92" rx="7" transform="rotate(60)"/>
    <rect x="-7" y="-46" width="14" height="92" rx="7" transform="rotate(120)"/>
  </g>
  <!-- bars over block -->
  <g stroke="#b9c3ba" stroke-width="7">
    <line x1="752" y1="236" x2="752" y2="604"/>
    <line x1="848" y1="236" x2="848" y2="604"/>
  </g>
  <!-- cable from frame to brake -->
  <path d="M990 470 C1060 470 1060 520 1120 520" fill="none" stroke="#7d8a83" stroke-width="10" stroke-linecap="round"/>

  <!-- emergency brake (right) -->
  <rect x="1110" y="430" width="200" height="200" rx="18" fill="#3b4642" stroke="#55625c" stroke-width="6"/>
  <g stroke="#e0b341" stroke-width="12" opacity="0.9">
    <line x1="1122" y1="450" x2="1142" y2="430"/><line x1="1158" y1="450" x2="1178" y2="430"/>
    <line x1="1194" y1="450" x2="1214" y2="430"/><line x1="1230" y1="450" x2="1250" y2="430"/>
    <line x1="1266" y1="450" x2="1286" y2="430"/>
  </g>
  <rect x="1180" y="560" width="60" height="40" rx="8" fill="#2a3330"/>
  <path d="M1210 575 L1250 330" stroke="#8e9893" stroke-width="22" stroke-linecap="round"/>
  <circle cx="1252" cy="318" r="40" fill="#c8452f"/>
  <circle cx="1240" cy="304" r="11" fill="#e8806b"/>

  <g transform="translate(0 -16)">
  <!-- Touch ID key on desk (center bottom) -->
  <rect x="720" y="660" width="160" height="70" rx="14" fill="#2c2f31"/>
  <rect x="730" y="652" width="140" height="66" rx="12" fill="#3a3e41"/>
  <g fill="none" stroke="#c9d1cc" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M786 700 a14 14 0 0 1 28 0"/>
    <path d="M778 702 a22 22 0 0 1 44 0"/>
    <path d="M770 704 a30 30 0 0 1 60 0"/>
    <path d="M800 704 v8"/>
  </g>
  <!-- single finger reaching key -->
  <path d="M940 736 C930 712 905 700 880 700 L842 700 C832 700 826 692 830 683 C834 675 842 672 850 672 L900 672 C930 672 960 690 975 736 Z" fill="#e9b894"/>
  <path d="M842 700 C832 700 826 692 830 683" fill="none" stroke="#c99472" stroke-width="3"/>
  <rect x="955" y="700" width="120" height="40" rx="18" fill="#4f6b8a"/>
  </g>
</svg>
