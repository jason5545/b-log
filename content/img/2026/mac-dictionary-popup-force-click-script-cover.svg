<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#17222b"/>
  <g fill="#e4e0d2" opacity="0.3">
    <circle cx="150" cy="130" r="2"/><circle cx="1450" cy="160" r="2.2"/><circle cx="260" cy="770" r="1.6"/>
    <circle cx="1380" cy="780" r="1.8"/><circle cx="100" cy="470" r="1.4"/><circle cx="1520" cy="450" r="1.5"/>
  </g>
  <!-- a closed book (the dictionary) -->
  <rect x="520" y="250" width="560" height="400" rx="14" fill="#2a3b47" stroke="#e4e0d2" stroke-width="4"/>
  <rect x="520" y="250" width="56" height="400" rx="14" fill="#3b7ea1"/>
  <line x1="600" y1="320" x2="1040" y2="320" stroke="#e4e0d2" stroke-opacity="0.25" stroke-width="3"/>
  <line x1="600" y1="580" x2="1040" y2="580" stroke="#e4e0d2" stroke-opacity="0.25" stroke-width="3"/>
  <!-- a clamp holding it shut -->
  <rect x="1030" y="330" width="90" height="240" rx="10" fill="#c9a874"/>
  <rect x="1060" y="360" width="40" height="180" rx="6" fill="#17222b"/>
  <!-- a press ring: the firm click that starts it -->
  <g fill="none" stroke="#3b7ea1" stroke-width="4">
    <circle cx="1240" cy="450" r="34" stroke-opacity="0.9"/>
    <circle cx="1240" cy="450" r="64" stroke-opacity="0.5"/>
    <circle cx="1240" cy="450" r="98" stroke-opacity="0.25"/>
  </g>
  <circle cx="1240" cy="450" r="10" fill="#e4e0d2"/>
  <line x1="1120" y1="450" x2="1190" y2="450" stroke="#e4e0d2" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="8 10"/>
</svg>
