<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e2d4bc"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- faint grid background -->
  <g stroke="#d6c7ab" stroke-width="2" opacity="0.6">
    <line x1="0" y1="120" x2="1600" y2="120"/><line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="100" y1="0" x2="100" y2="900"/><line x1="1500" y1="0" x2="1500" y2="900"/>
  </g>
  <!-- browser window with a form -->
  <g>
    <rect x="300" y="210" width="640" height="480" rx="18" fill="#3a3330"/>
    <rect x="300" y="210" width="640" height="56" rx="18" fill="#2b2523"/>
    <rect x="300" y="240" width="640" height="26" fill="#2b2523"/>
    <circle cx="336" cy="238" r="9" fill="#d9644a"/>
    <circle cx="364" cy="238" r="9" fill="#e0a84a"/>
    <circle cx="392" cy="238" r="9" fill="#7fa36a"/>
    <rect x="430" y="226" width="460" height="24" rx="12" fill="#4a423e"/>
    <rect x="318" y="282" width="604" height="390" rx="8" fill="url(#win)"/>
    <!-- form fields (abstract) -->
    <g fill="none" stroke="#b9a98d" stroke-width="4">
      <rect x="360" y="320" width="380" height="44" rx="8"/>
      <rect x="360" y="390" width="380" height="44" rx="8"/>
      <rect x="360" y="460" width="520" height="96" rx="8"/>
    </g>
    <g stroke="#8c7b62" stroke-width="8" stroke-linecap="round">
      <line x1="380" y1="490" x2="780" y2="490"/>
      <line x1="380" y1="520" x2="700" y2="520"/>
    </g>
    <!-- submit button -->
    <rect x="690" y="590" width="190" height="56" rx="12" fill="#d97757"/>
    <path d="M760 618 l18 16 l32 -34" fill="none" stroke="#fbf7ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- lowered barrier in front of the button, with the arm going around it -->
  <g>
    <rect x="1080" y="470" width="26" height="250" rx="6" fill="#5b4f48"/>
    <rect x="1066" y="700" width="54" height="22" rx="4" fill="#3a3330"/>
    <g transform="rotate(-8 1093 500)">
      <rect x="620" y="488" width="480" height="26" rx="8" fill="#fbf7ef" stroke="#3a3330" stroke-width="4"/>
      <g fill="#b4472f">
        <rect x="660" y="490" width="40" height="22"/>
        <rect x="760" y="490" width="40" height="22"/>
        <rect x="860" y="490" width="40" height="22"/>
        <rect x="960" y="490" width="40" height="22"/>
      </g>
    </g>
  </g>
  <!-- robotic arm reaching around the barrier to press submit -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1300 300 C1240 330 1180 340 1120 380 C1040 430 1000 560 900 620" stroke="#3a3330" stroke-width="34"/>
    <path d="M1300 300 C1240 330 1180 340 1120 380 C1040 430 1000 560 900 620" stroke="#d97757" stroke-width="20"/>
  </g>
  <circle cx="1300" cy="300" r="40" fill="#3a3330"/>
  <circle cx="1300" cy="300" r="20" fill="#d97757"/>
  <circle cx="1120" cy="380" r="22" fill="#3a3330"/>
  <g transform="translate(888 626) rotate(30)">
    <rect x="-24" y="-18" width="48" height="36" rx="8" fill="#3a3330"/>
    <rect x="-40" y="-14" width="22" height="10" rx="4" fill="#3a3330"/>
    <rect x="-40" y="4" width="22" height="10" rx="4" fill="#3a3330"/>
  </g>
  <!-- small sieve on the right catching a user's note -->
  <g transform="translate(-50 0)">
    <path d="M1250 560 L1410 560 L1350 650 L1310 650 Z" fill="#5b4f48"/>
    <g stroke="#efe6d6" stroke-width="3" opacity="0.8">
      <line x1="1270" y1="578" x2="1390" y2="578"/><line x1="1282" y1="598" x2="1378" y2="598"/>
      <line x1="1295" y1="618" x2="1365" y2="618"/>
    </g>
    <g transform="rotate(-12 1330 540)">
      <rect x="1290" y="510" width="80" height="54" rx="4" fill="#fbf7ef" stroke="#8c7b62" stroke-width="3"/>
      <line x1="1304" y1="528" x2="1356" y2="528" stroke="#8c7b62" stroke-width="5" stroke-linecap="round"/>
      <line x1="1304" y1="544" x2="1344" y2="544" stroke="#8c7b62" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
