<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a20"/>
      <stop offset="1" stop-color="#2a1d16"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e7cf"/>
      <stop offset="1" stop-color="#e6d3ad"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f2b766" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2b766" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- wall planks -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <g stroke="#22170f" stroke-width="4" opacity="0.7">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>
  <g stroke="#22170f" stroke-width="3" opacity="0.5">
    <line x1="260" y1="0" x2="260" y2="150"/><line x1="910" y1="0" x2="910" y2="150"/>
    <line x1="520" y1="150" x2="520" y2="300"/><line x1="1340" y1="150" x2="1340" y2="300"/>
    <line x1="150" y1="300" x2="150" y2="450"/><line x1="1460" y1="450" x2="1460" y2="600"/>
    <line x1="380" y1="600" x2="380" y2="750"/><line x1="1100" y1="750" x2="1100" y2="900"/>
  </g>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <!-- notice board frame -->
  <rect x="410" y="190" width="780" height="520" rx="14" fill="#6b4428"/>
  <rect x="436" y="216" width="728" height="468" rx="6" fill="#8a5a36"/>
  <g stroke="#73492b" stroke-width="3" opacity="0.6">
    <line x1="436" y1="330" x2="1164" y2="330"/>
    <line x1="436" y1="450" x2="1164" y2="450"/>
    <line x1="436" y1="570" x2="1164" y2="570"/>
  </g>
  <!-- pinned notice paper -->
  <g transform="rotate(-2 640 450)">
    <rect x="490" y="250" width="320" height="400" fill="url(#paper)"/>
    <path d="M810 600 L810 650 L760 650 Z" fill="#cdb68a"/>
    <!-- red seal -->
    <circle cx="650" cy="320" r="34" fill="#b4472f"/>
    <circle cx="650" cy="320" r="24" fill="none" stroke="#f3e7cf" stroke-width="4"/>
    <!-- abstract rule lines -->
    <g stroke="#7a6347" stroke-width="10" stroke-linecap="round">
      <line x1="530" y1="400" x2="770" y2="400"/>
      <line x1="530" y1="440" x2="740" y2="440"/>
      <line x1="530" y1="480" x2="760" y2="480"/>
      <line x1="530" y1="520" x2="700" y2="520"/>
    </g>
    <line x1="530" y1="575" x2="770" y2="575" stroke="#b4472f" stroke-width="10" stroke-linecap="round"/>
    <circle cx="650" cy="262" r="10" fill="#c9a24a" stroke="#5a3b1f" stroke-width="3"/>
  </g>
  <!-- chat bubble card -->
  <g transform="rotate(3 990 430)">
    <rect x="860" y="290" width="270" height="240" fill="#f3e7cf"/>
    <circle cx="995" cy="302" r="10" fill="#c9a24a" stroke="#5a3b1f" stroke-width="3"/>
    <path d="M900 340 h190 a22 22 0 0 1 22 22 v80 a22 22 0 0 1 -22 22 h-120 l-34 30 v-30 h-36 a22 22 0 0 1 -22 -22 v-80 a22 22 0 0 1 22 -22 z" fill="#d97757"/>
    <g transform="translate(995 402)" fill="#f3e7cf">
      <rect x="-4" y="-26" width="8" height="52" rx="4"/>
      <rect x="-4" y="-26" width="8" height="52" rx="4" transform="rotate(60)"/>
      <rect x="-4" y="-26" width="8" height="52" rx="4" transform="rotate(120)"/>
    </g>
  </g>
  <!-- tankard on shelf -->
  <rect x="300" y="742" width="1000" height="20" fill="#4a3020"/>
  <g transform="translate(1210 650)">
    <rect x="0" y="0" width="70" height="92" rx="8" fill="#a9763f"/>
    <rect x="0" y="0" width="70" height="16" rx="8" fill="#f1e2c0"/>
    <path d="M70 22 q34 0 34 30 q0 30 -34 30" fill="none" stroke="#a9763f" stroke-width="12"/>
  </g>
  <!-- hanging lantern -->
  <line x1="320" y1="0" x2="320" y2="230" stroke="#1d130d" stroke-width="5"/>
  <rect x="290" y="230" width="60" height="80" rx="10" fill="#3d2a1c" stroke="#1d130d" stroke-width="4"/>
  <rect x="302" y="244" width="36" height="52" rx="6" fill="#f2b766"/>
</svg>
