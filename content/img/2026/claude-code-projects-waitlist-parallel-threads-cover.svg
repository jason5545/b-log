  <!-- usage meter -->
  <g transform="translate(1185 470)">
    <rect x="-150" y="-150" width="300" height="230" rx="24" fill="#3c4548" stroke="#56615f" stroke-width="6"/>
    <path d="M-105 30 A105 105 0 0 1 -52 -61" fill="none" stroke="#8fae7a" stroke-width="26"/>
    <path d="M-52 -61 A105 105 0 0 1 52 -61" fill="none" stroke="#e0a83c" stroke-width="26"/>
    <path d="M52 -61 A105 105 0 0 1 105 30" fill="none" stroke="#c8452f" stroke-width="26"/>
    <line x1="0" y1="30" x2="78" y2="-36" stroke="#efe3c8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="30" r="16" fill="#efe3c8"/>
    <rect x="-90" y="54" width="180" height="10" rx="5" fill="#2a3134"/>
  </g>
  <!-- cable from cloud to meter -->
  <path d="M975 300 C1050 300 1060 330 1110 330" fill="none" stroke="#9aa59c" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
